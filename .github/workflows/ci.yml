name: CI

on:
  push:
    branches: [main, alphasignal-main]
  pull_request:
    branches: [main, alphasignal-main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (no TV required)
        run: npm run test:unit

      - name: Smoke test script — syntax check
        run: node --check scripts/smoke-test.js
